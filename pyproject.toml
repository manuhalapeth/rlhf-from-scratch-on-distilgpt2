[project]
name = "rlhf-from-scratch-on-distilgpt2"
version = "0.1.0"
description = "A from scratch reinforcement learning from human feedback pipeline built on DistilGPT2."
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["rlhf*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
